name: Build Equipped fleetctl

# Builds the fleetctl binary from the Equipped fork for use by
# equipped-mdm's deploy pipeline to generate rebranded agent packages.
#
# The equipped-mdm server downloads the pre-built binary from this
# workflow's release artifacts — no Go needed on the server.

on:
  push:
    branches:
      - main
      - equipped-agent-rebrand
    paths:
      - 'cmd/fleetctl/**'
      - 'server/**'
      - 'orbit/pkg/packaging/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-equipped-fleetctl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux_amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build fleetctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -o "fleetctl-${ARTIFACT_SUFFIX}" \
            -ldflags "-X github.com/fleetdm/fleet/v4/server/version.appName=fleetctl-equipped -X github.com/fleetdm/fleet/v4/server/version.version=${VERSION}" \
            ./cmd/fleetctl/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetctl-${{ matrix.suffix }}
          path: fleetctl-${{ matrix.suffix }}
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package binaries
        run: |
          mkdir -p dist
          for dir in artifacts/fleetctl-*; do
            name=$(basename "$dir")
            cp "$dir/$name" "dist/$name"
            chmod +x "dist/$name"
            tar czf "dist/${name}.tar.gz" -C dist "$name"
          done
          ls -la dist/

      - name: Create or update release
        env:
          COMMIT_SHA: ${{ github.sha }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fleetctl-equipped-latest
          name: "Equipped fleetctl (latest)"
          body: |
            Pre-built fleetctl binary from the Equipped fork.
            Used by equipped-mdm to generate rebranded agent packages.
          prerelease: true
          files: dist/*.tar.gz
          make_latest: false

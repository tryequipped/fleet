name: Build Equipped fleetctl + agent + packages

# Builds fleetctl, the equipped-agent (orbit) binary, and installer
# packages (.pkg for macOS) from the Equipped fork.

on:
  push:
    branches:
      - main
      - equipped-agent-rebrand
    paths:
      - 'cmd/fleetctl/**'
      - 'server/**'
      - 'orbit/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-equipped-fleetctl.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux_amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build fleetctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -o "fleetctl-${ARTIFACT_SUFFIX}" \
            -ldflags "-X github.com/fleetdm/fleet/v4/server/version.appName=fleetctl-equipped -X github.com/fleetdm/fleet/v4/server/version.version=${VERSION}" \
            ./cmd/fleetctl/

      - name: Build equipped-agent (orbit)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -o "equipped-agent-${ARTIFACT_SUFFIX}" \
            -ldflags "-X github.com/fleetdm/fleet/v4/orbit/pkg/build.Version=${VERSION}" \
            ./orbit/cmd/orbit/

      - name: Upload fleetctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetctl-${{ matrix.suffix }}
          path: fleetctl-${{ matrix.suffix }}
          retention-days: 90

      - name: Upload equipped-agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: equipped-agent-${{ matrix.suffix }}
          path: equipped-agent-${{ matrix.suffix }}
          retention-days: 90

  # Build macOS .pkg installer on a macOS runner (requires pkgbuild/productbuild)
  package-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Download fleetctl for macOS
        uses: actions/download-artifact@v4
        with:
          name: fleetctl-darwin_arm64

      - name: Build .pkg
        run: |
          chmod +x fleetctl-darwin_arm64

          # Build .pkg with rebranded packaging templates.
          # Fleet URL placeholder — real URL injected via MDM config profile at runtime.
          # Enroll secret placeholder — real secret injected via MDM config profile at runtime.
          ./fleetctl-darwin_arm64 package \
            --type=pkg \
            --fleet-url=https://fleet.placeholder.equipped.dev \
            --enroll-secret=ENROLL_SECRET_FROM_MDM_PROFILE \
            --disable-updates \
            --fleet-desktop=false \
            --outfile=fleetd-base.pkg

          ls -la fleetd-base.pkg
          PKG_SHA256=$(shasum -a 256 fleetd-base.pkg | cut -d' ' -f1)
          echo "PKG_SHA256=${PKG_SHA256}" >> "$GITHUB_ENV"
          echo "Package SHA256: ${PKG_SHA256}"

      - name: Generate manifest plist
        run: |
          # The manifest plist tells macOS where to download the .pkg.
          # EQUIPPED_DOWNLOAD_URL is set per-environment in equipped-mdm.
          # This manifest uses a relative path that works with any base URL.
          cat > fleetd-base-manifest.plist << 'MANIFEST_EOF'
          <plist version="1.0">
            <dict>
              <key>items</key>
              <array>
                <dict>
                  <key>assets</key>
                  <array>
                    <dict>
                      <key>kind</key>
                      <string>software-package</string>
                      <key>url</key>
                      <string>EQUIPPED_PKG_URL_PLACEHOLDER</string>
                    </dict>
                  </array>
                </dict>
              </array>
            </dict>
          </plist>
          MANIFEST_EOF

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetd-base-pkg
          path: |
            fleetd-base.pkg
            fleetd-base-manifest.plist
          retention-days: 90

  release:
    needs: [build, package-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package binaries and installers
        run: |
          mkdir -p dist

          # Package fleetctl and orbit binaries
          for dir in artifacts/fleetctl-* artifacts/equipped-agent-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            cp "$dir/$name" "dist/$name"
            chmod +x "dist/$name"
            tar czf "dist/${name}.tar.gz" -C dist "$name"
          done

          # Copy .pkg and manifest (not compressed — served as-is)
          if [ -d "artifacts/fleetd-base-pkg" ]; then
            cp artifacts/fleetd-base-pkg/fleetd-base.pkg dist/
            cp artifacts/fleetd-base-pkg/fleetd-base-manifest.plist dist/
          fi

          ls -la dist/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fleetctl-equipped-latest
          name: "Equipped fleetctl + agent + packages (latest)"
          body: |
            Pre-built binaries and packages from the Equipped fork.
            - fleetctl: generates rebranded installer packages
            - equipped-agent: the rebranded orbit binary
            - fleetd-base.pkg: macOS installer package (rebranded)
            - fleetd-base-manifest.plist: manifest for MDM InstallEnterpriseApplication
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/fleetd-base.pkg
            dist/fleetd-base-manifest.plist
          make_latest: false

  # Build Fleet server Docker image from the fork
  # This image includes our FLEET_FLEETD_BASE_URL env var support
  fleet-server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install dependencies and generate assets
        run: |
          make deps-js
          make generate

      - name: Build fleet server binary
        env:
          CGO_ENABLED: '1'
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -o fleet \
            -tags full,fts5,netgo \
            -ldflags "-extldflags '-static' -X github.com/fleetdm/fleet/v4/server/version.appName=fleet-equipped -X github.com/fleetdm/fleet/v4/server/version.version=${VERSION}" \
            ./cmd/fleet/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          cp fleet tools/fleet-docker/
          cd tools/fleet-docker
          docker build -t equipped/fleet:latest .
          docker push equipped/fleet:latest
          echo "Pushed equipped/fleet:latest"

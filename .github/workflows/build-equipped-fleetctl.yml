name: Build Equipped fleetctl + orbit

# Builds fleetctl and the equipped-agent (orbit) binary from the Equipped fork.
# fleetctl is used by equipped-mdm to generate installer packages.
# The orbit binary is injected into the package to replace the stock one,
# so the installed agent reports Equipped branding and version.

on:
  push:
    branches:
      - main
      - equipped-agent-rebrand
    paths:
      - 'cmd/fleetctl/**'
      - 'server/**'
      - 'orbit/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-equipped-fleetctl.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux_amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build fleetctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -o "fleetctl-${ARTIFACT_SUFFIX}" \
            -ldflags "-X github.com/fleetdm/fleet/v4/server/version.appName=fleetctl-equipped -X github.com/fleetdm/fleet/v4/server/version.version=${VERSION}" \
            ./cmd/fleetctl/

      - name: Build equipped-agent (orbit)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -o "equipped-agent-${ARTIFACT_SUFFIX}" \
            -ldflags "-X github.com/fleetdm/fleet/v4/orbit/pkg/build.Version=${VERSION}" \
            ./orbit/cmd/orbit/

      - name: Upload fleetctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetctl-${{ matrix.suffix }}
          path: fleetctl-${{ matrix.suffix }}
          retention-days: 90

      - name: Upload equipped-agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: equipped-agent-${{ matrix.suffix }}
          path: equipped-agent-${{ matrix.suffix }}
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package binaries
        run: |
          mkdir -p dist
          for dir in artifacts/fleetctl-* artifacts/equipped-agent-*; do
            name=$(basename "$dir")
            cp "$dir/$name" "dist/$name"
            chmod +x "dist/$name"
            tar czf "dist/${name}.tar.gz" -C dist "$name"
          done
          ls -la dist/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fleetctl-equipped-latest
          name: "Equipped fleetctl + agent (latest)"
          body: |
            Pre-built binaries from the Equipped fork.
            - fleetctl: generates rebranded installer packages
            - equipped-agent: the rebranded orbit binary (replaces stock in packages)
          prerelease: true
          files: dist/*.tar.gz
          make_latest: false
